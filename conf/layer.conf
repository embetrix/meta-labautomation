# Make this layer's configuration and classes available to BitBake.
BBPATH .= ":${LAYERDIR}"

# Discover recipes and recipe extensions in the standard layer layout.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Enable integrations when their matching layer is present
BBFILES_DYNAMIC += " \
    labgrid:${LAYERDIR}/dynamic-layers/labgrid/recipes-*/*/*.bb \
    labgrid:${LAYERDIR}/dynamic-layers/labgrid/recipes-*/*/*.bbappend \
    raspberrypi-secure:${LAYERDIR}/dynamic-layers/raspberrypi-secure/recipes-*/*/*.bb \
    raspberrypi-secure:${LAYERDIR}/dynamic-layers/raspberrypi-secure/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "labautomation"
BBFILE_PATTERN_labautomation = "^${LAYERDIR}/"
BBFILE_PRIORITY_labautomation = "6"

LAYERDEPENDS_labautomation = "core openembedded-layer meta-python freescale-layer virtualization-layer webserver"
LAYERSERIES_COMPAT_labautomation = "wrynose"

# Use labgrid's RFC2217 fixes when meta-labgrid is present
PREFERRED_VERSION_python3-pyserial ?= "${@bb.utils.contains('BBFILE_COLLECTIONS', 'labgrid', '3.5.0.2', '', d)}"
