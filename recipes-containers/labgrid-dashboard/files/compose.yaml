# Uses the controller's existing coordinator and local exporter. No coordinator container.
name: labgrid-dashboard
services:
  api:
    image: labautomation/labgrid-dashboard-api:e1088e62-3
    build:
      context: ./source
      dockerfile: coordinator/api/Dockerfile
      network: host
    network_mode: host
    init: true
    env_file:
      - @SYSCONFDIR@/labgrid-dashboard/environment
    environment:
      LABGRID_EXPORTER_HOST: "${LABGRID_EXPORTER_HOST:-${LABGRID_CONTROLLER_HOST:?Start through labgrid-dashboard.service or set LABGRID_EXPORTER_HOST}}"
    volumes:
      - api-data:/data
      - @SYSCONFDIR@/labgrid-dashboard/ssh:/root/.ssh:ro
    # Bypass upstream's entrypoint, which adds hosts from its author's lab.
    entrypoint: []
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "18000", "--root-path", "/labgrid"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  web:
    image: labautomation/labgrid-dashboard-web:e1088e62-2
    build:
      context: ./source/coordinator/web
      network: host
    network_mode: host
    volumes:
      - @SYSCONFDIR@/labgrid-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  api-data:
