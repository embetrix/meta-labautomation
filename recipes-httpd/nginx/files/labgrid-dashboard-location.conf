# Include inside the existing HTTPS server; retain its TLS and authentication.
location = /labgrid {
    if ($scheme != https) { return 404; }
    return 308 /labgrid/;
}

location ^~ /labgrid/ {
    # Fail closed if a site accidentally includes this in a plaintext server.
    if ($scheme != https) { return 404; }

    # Strip the public prefix before forwarding to the internal web server.
    proxy_pass http://127.0.0.1:3000/;
    proxy_cookie_path / /labgrid/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_buffering off;
}
